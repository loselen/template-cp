name: tests

on:
  push:
  pull_request:

jobs:
  self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: ./reference/run_tests.sh
      - name: trd.md is current and passes every self-test
        run: python3 reference/build_trd.py --check
